[package]
name = "litesvm-go"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/LiteSVM/litesvm-go"
rust-version = "1.86.0"
description = "C ABI bindings for LiteSVM, intended for use from Go via cgo"
publish = false

[lib]
name = "litesvm_go"
crate-type = ["cdylib", "staticlib"]

[dependencies]
agave-feature-set = "3.1.0"
bincode = "1.3.3"
litesvm = { version = "0.11", features = ["nodejs-internal", "precompiles"] }
solana-account = "4.3.0"
solana-address = "2.0"
solana-clock = "3.0"
solana-compute-budget = "3.1.0"
solana-epoch-rewards = "3.0"
solana-epoch-schedule = "3.0"
solana-hash = "4.3.0"
solana-last-restart-slot = "3.0"
solana-rent = "4.2"
solana-slot-hashes = "3.0"
solana-slot-history = "3.0"
solana-stake-interface = "4.0.0"
solana-keypair = "3.1"
solana-message = "4.1.1"
solana-signature = "3.1.0"
solana-signer = "3.0"
solana-system-interface = { version = "3.2", features = ["bincode"] }
solana-transaction = "4.1"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
opt-level = "s"

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
